<?xml version="1.0" encoding="UTF-8"?>
<svg width="8" height="16" viewBox="0 0 8 16" xmlns="http://www.w3.org/2000/svg">
  <!-- Bala del jugador -->
  <defs>
    <linearGradient id="bulletGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0080FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004080;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Resplandor -->
  <ellipse cx="4" cy="8" rx="6" ry="10" fill="url(#glowGradient)"/>
  
  <!-- Cuerpo principal -->
  <ellipse cx="4" cy="8" rx="2" ry="6" fill="url(#bulletGradient)" stroke="#004080" stroke-width="0.5"/>
  
  <!-- Punta -->
  <ellipse cx="4" cy="4" rx="1.5" ry="3" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Núcleo brillante -->
  <rect x="3" y="6" width="2" height="4" fill="#FFFFFF" opacity="0.7"/>
</svg> 