<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono de munición -->
  <defs>
    <linearGradient id="ammoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ammoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Resplandor -->
  <circle cx="12" cy="12" r="14" fill="url(#ammoGlow)"/>
  
  <!-- Fondo del icono -->
  <circle cx="12" cy="12" r="10" fill="url(#ammoGradient)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Bala principal -->
  <ellipse cx="12" cy="12" rx="3" ry="8" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  
  <!-- Punta de la bala -->
  <ellipse cx="12" cy="7" rx="2" ry="4" fill="#FFFFFF" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Vaina -->
  <rect x="9" y="16" width="6" height="4" fill="#CD853F" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Detalles -->
  <line x1="9" y1="18" x2="15" y2="18" stroke="#8B4513" stroke-width="1"/>
  <circle cx="12" cy="10" r="1" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Líneas de detalle en la bala -->
  <line x1="10" y1="12" x2="14" y2="12" stroke="#A0A0A0" stroke-width="0.5"/>
  <line x1="10" y1="14" x2="14" y2="14" stroke="#A0A0A0" stroke-width="0.5"/>
  
  <!-- Marco interior -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
</svg> 