<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Alien enemigo -->
  <defs>
    <radialGradient id="alienBodyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="alienShellGradient" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#A0522D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="eyeGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AA0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Cuerpo principal -->
  <ellipse cx="16" cy="20" rx="12" ry="8" fill="url(#alienBodyGradient)" stroke="#654321" stroke-width="1"/>
  
  <!-- Caparazón superior -->
  <ellipse cx="16" cy="12" rx="10" ry="8" fill="url(#alienShellGradient)" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Patas -->
  <ellipse cx="8" cy="24" rx="2" ry="4" fill="#654321" stroke="#543A21" stroke-width="1"/>
  <ellipse cx="12" cy="26" rx="2" ry="4" fill="#654321" stroke="#543A21" stroke-width="1"/>
  <ellipse cx="20" cy="26" rx="2" ry="4" fill="#654321" stroke="#543A21" stroke-width="1"/>
  <ellipse cx="24" cy="24" rx="2" ry="4" fill="#654321" stroke="#543A21" stroke-width="1"/>
  
  <!-- Ojos -->
  <circle cx="12" cy="10" r="4" fill="url(#eyeGradient)" stroke="#AA0000" stroke-width="1"/>
  <circle cx="20" cy="10" r="4" fill="url(#eyeGradient)" stroke="#AA0000" stroke-width="1"/>
  
  <!-- Pupilas -->
  <circle cx="12" cy="10" r="2" fill="#000000"/>
  <circle cx="20" cy="10" r="2" fill="#000000"/>
  
  <!-- Brillos en los ojos -->
  <circle cx="13" cy="9" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="21" cy="9" r="1" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Mandíbulas -->
  <path d="M10 16 L14 20 L18 20 L22 16" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Detalles del caparazón -->
  <path d="M6 12 Q16 8 26 12" fill="none" stroke="#A0522D" stroke-width="1" opacity="0.7"/>
  <path d="M8 16 Q16 12 24 16" fill="none" stroke="#A0522D" stroke-width="1" opacity="0.7"/>
  
  <!-- Antenas -->
  <line x1="10" y1="4" x2="8" y2="2" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="4" x2="24" y2="2" stroke="#654321" stroke-width="2" stroke-linecap="round"/>
  <circle cx="8" cy="2" r="1" fill="#FF4444"/>
  <circle cx="24" cy="2" r="1" fill="#FF4444"/>
</svg> 