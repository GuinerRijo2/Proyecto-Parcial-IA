<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Nave espacial del jugador -->
  <defs>
    <linearGradient id="shipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cockpitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#417505;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Casco principal -->
  <path d="M16 4 L26 24 L20 20 L16 24 L12 20 L6 24 Z" fill="url(#shipGradient)" stroke="#1A4480" stroke-width="1"/>
  
  <!-- Alas laterales -->
  <path d="M6 24 L2 28 L8 26 Z" fill="#2E5C8A" stroke="#1A4480" stroke-width="1"/>
  <path d="M26 24 L30 28 L24 26 Z" fill="#2E5C8A" stroke="#1A4480" stroke-width="1"/>
  
  <!-- Cabina -->
  <ellipse cx="16" cy="14" rx="4" ry="6" fill="url(#cockpitGradient)" stroke="#417505" stroke-width="1"/>
  
  <!-- Motores -->
  <rect x="10" y="22" width="3" height="4" fill="#FF6B6B" stroke="#D63031" stroke-width="1"/>
  <rect x="19" y="22" width="3" height="4" fill="#FF6B6B" stroke="#D63031" stroke-width="1"/>
  
  <!-- Detalles tecnológicos -->
  <circle cx="16" cy="12" r="2" fill="#00B894" stroke="#00A085" stroke-width="1"/>
  <rect x="14" y="8" width="4" height="2" fill="#FDCB6E" stroke="#E17055" stroke-width="1"/>
</svg> 