<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Piso de base espacial -->
  <defs>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A2A2A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F0F0F;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1A1A1A"/>
      <line x1="0" y1="0" x2="8" y2="0" stroke="#333333" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333333" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Base del piso -->
  <rect width="32" height="32" fill="url(#floorGradient)"/>
  
  <!-- Patrón de rejilla -->
  <rect width="32" height="32" fill="url(#gridPattern)" opacity="0.6"/>
  
  <!-- Detalles tecnológicos -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#004080" stroke-width="1" opacity="0.3"/>
  <circle cx="16" cy="16" r="4" fill="none" stroke="#004080" stroke-width="1" opacity="0.5"/>
  
  <!-- Luces LED -->
  <rect x="2" y="2" width="2" height="2" fill="#00FF00" opacity="0.4"/>
  <rect x="28" y="2" width="2" height="2" fill="#00FF00" opacity="0.4"/>
  <rect x="2" y="28" width="2" height="2" fill="#00FF00" opacity="0.4"/>
  <rect x="28" y="28" width="2" height="2" fill="#00FF00" opacity="0.4"/>
  
  <!-- Líneas de energía -->
  <line x1="16" y1="0" x2="16" y2="32" stroke="#0080FF" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="16" x2="32" y2="16" stroke="#0080FF" stroke-width="0.5" opacity="0.3"/>
</svg> 