<?xml version="1.0" encoding="UTF-8"?>
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Icono de salud -->
  <defs>
    <radialGradient id="healthGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006600;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glowHealth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00FF00;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00FF00;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Resplandor -->
  <circle cx="12" cy="12" r="14" fill="url(#glowHealth)"/>
  
  <!-- Fondo del icono -->
  <circle cx="12" cy="12" r="10" fill="url(#healthGradient)" stroke="#004400" stroke-width="2"/>
  
  <!-- Cruz médica -->
  <rect x="10" y="5" width="4" height="14" fill="#FFFFFF" rx="1"/>
  <rect x="5" y="10" width="14" height="4" fill="#FFFFFF" rx="1"/>
  
  <!-- Detalles brillantes -->
  <rect x="11" y="6" width="2" height="12" fill="#CCFFCC" opacity="0.8"/>
  <rect x="6" y="11" width="12" height="2" fill="#CCFFCC" opacity="0.8"/>
  
  <!-- Marco interior -->
  <circle cx="12" cy="12" r="8" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
</svg> 